name: Race Day Plan page
# Not launched yet: publishes the "coming soon" page, and only when started by
# hand. To launch, change the path below back to `site` (and the trigger back
# to pushes on site/**).
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
# Two jobs, as in GitHub's own Pages examples: deploying in the same job that
# uploaded sometimes found no files yet (24 Nov 2026: "No artifacts named
# github-pages were found" while the upload had succeeded a second earlier).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: coming-soon
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
